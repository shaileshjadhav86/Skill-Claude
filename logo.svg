<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F5D97A"/>
      <stop offset="40%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#F5D97A"/>
      <stop offset="60%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Z shape (left side) -->
  <polygon points="18,22 80,22 80,34 36,88 80,88 80,100 18,100 18,88 62,34 18,34" fill="url(#g1)"/>
  <!-- Z top speed slash -->
  <polygon points="74,14 110,14 110,22 74,22" fill="url(#g1)" opacity="0.6"/>

  <!-- G shape (right side) -->
  <!-- Outer arc approximated as polygon -->
  <path d="M120,22 L152,22 L152,34 L132,34 A30,30 0 1 0 162,61 L162,78 L140,78 L140,66 L150,66 A18,18 0 1 1 120,61 Z" fill="url(#g2)"/>
  <!-- G inner horizontal bar -->
  <rect x="140" y="54" width="22" height="12" fill="url(#g2)"/>

  <!-- Brand name -->
  <text x="110" y="138" font-family="'Arial', sans-serif" font-weight="700" font-size="16" fill="url(#g1)" letter-spacing="6" text-anchor="middle">ZACH GLOBAL</text>
  <!-- Decorative lines around STUDIO -->
  <line x1="30" y1="158" x2="72" y2="158" stroke="url(#g1)" stroke-width="1" opacity="0.5"/>
  <line x1="148" y1="158" x2="190" y2="158" stroke="url(#g1)" stroke-width="1" opacity="0.5"/>
  <text x="110" y="163" font-family="'Arial', sans-serif" font-weight="400" font-size="11" fill="url(#g1)" letter-spacing="8" text-anchor="middle">STUDIO</text>
</svg>
