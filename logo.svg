<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 48" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- ZG lettermark -->
  <text x="2" y="40" font-family="'Arial Black','Arial Bold',Arial,sans-serif" font-weight="900" font-size="38" fill="url(#g)" letter-spacing="-1">ZG</text>
  <!-- Vertical separator -->
  <rect x="88" y="8" width="1.5" height="32" rx="1" fill="#D97706" opacity="0.4"/>
  <!-- Brand name -->
  <text x="98" y="22" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#FBBF24" letter-spacing="1.8">ZACH GLOBAL</text>
  <!-- Studio label -->
  <text x="98" y="38" font-family="Arial,sans-serif" font-weight="400" font-size="9.5" fill="#94A3B8" letter-spacing="4">STUDIO</text>
